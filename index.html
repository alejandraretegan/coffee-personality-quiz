 <!DOCTYPE html>                                                                        
  <html lang="en">                                                                       
  <head>                                                                                 
      <meta charset="UTF-8">                                                             
      <meta name="viewport" content="width=device-width, initial-scale=1.0">             
      <title>Alexandra's Cafe</title>                                                    
      <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Sourc
  e+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">                            
      <style>                                                                            
          * { margin: 0; padding: 0; box-sizing: border-box; }                           
          body {                                                                         
              font-family: 'Source Sans Pro', sans-serif;                                
              min-height: 100vh;                                                         
              background: url('2762716hfdkjdfkljsfl.jpg') center/cover no-repeat fixed;  
              display: flex;                                                             
              align-items: center;                                                       
              justify-content: center;                                                   
              text-align: center;                                                        
              padding: 20px;                                                             
          }                                                                              
          body::before {                                                                 
              content: '';                                                               
              position: fixed;                                                           
              top: 0;                                                                    
              left: 0;                                                                   
              width: 100%;                                                               
              height: 100%;                                                              
              background: rgba(0, 0, 0, 0.4);                                            
              z-index: 0;                                                                
          }                                                                              
          .content {                                                                     
              position: relative;                                                        
              z-index: 1;                                                                
          }                                                                              
          h1 {                                                                           
              font-family: 'Lora', serif;                                                
              font-size: 48px;                                                           
              color: #fff;                                                               
              margin-bottom: 20px;                                                       
              text-shadow: 0 2px 10px rgba(0,0,0,0.3);                                   
          }                                                                              
          p {                                                                            
              color: #f5e6d3;                                                            
              font-size: 20px;                                                           
              margin-bottom: 40px;                                                       
              max-width: 500px;                                                          
              text-shadow: 0 1px 5px rgba(0,0,0,0.3);                                    
          }                                                                              
          .btn {                                                                         
              background: linear-gradient(135deg, #d4a574, #c9956c);                     
              color: white;                                                              
              text-decoration: none;                                                     
              border-radius: 16px;                                                       
              padding: 18px 45px;                                                        
              font-size: 18px;                                                           
              font-weight: 700;                                                          
              box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);                                 
              transition: all 0.2s ease;                                                 
              display: inline-block;                                                     
          }                                                                              
          .btn:hover {                                                                   
              transform: translateY(-2px);                                               
              box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);                                
          }                                                                              
      </style>                                                                           
  </head>                                                                                
  <body>                                                                                 
      <div class="content">                                                              
          <h1>☕ Alexandra's Cafe</h1>                                                   
          <p>Discover your perfect coffee match with this personality quiz.</p>           
          <a href="quiz.html" class="btn">Take the Quiz →</a>                            
      </div>                                                                             
  </body>                                                                                
  </html>
